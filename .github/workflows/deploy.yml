name: Build and deploy to GitHub Pages

# Builds on every push and pull request. Deploys only on a manual run on main, so main can hold the demo on library
# prereleases without changing the public page.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: viamedici-spc/github-ci/.github/workflows/pages-bun.yml@feature/v4
    with:
      deploy: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
